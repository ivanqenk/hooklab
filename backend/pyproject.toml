[project]
name = "hooklab"
version = "0.1.0"
description = "A webhook gateway for development: receive, verify and forward"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "psycopg[binary,pool]>=3.3,<4.0",
    "alembic>=1.19,<2.0",
    "pydantic-settings>=2.15,<3.0",
    "redis>=5.3,<7.0",
    "arq>=0.28,<1.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors and pyflakes · I: import order · UP: modernise syntax
# B: common bugs (flake8-bugbear) · S: security (bandit) · ASYNC: async mistakes
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",           # assert is normal in tests
    # Test vectors are fake credentials by definition, and signature tests cannot
    # exist without them. Flagging every one is pure noise that trains people to
    # ignore the rule where it does matter -- in app/.
    "S105",
    "S106",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
# Strict where it pays off, without fighting the type system from day one.
warn_unused_configs = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
