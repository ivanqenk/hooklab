name: CI

on:
  push:
    branches: [main]
  pull_request:

# When several pushes arrive in a row, cancel the earlier ones: there is no point
# spending minutes verifying a commit that has already been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the minimum declared in pyproject: testing it stops newer syntax
        # from slipping in unnoticed. 3.14 is what local development runs.
        python: ["3.12", "3.14"]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hooklab
          POSTGRES_PASSWORD: hooklab
          POSTGRES_DB: hooklab
        ports:
          - 5432:5432
        # Without a healthcheck the steps start when the container exists, not when
        # Postgres accepts connections: intermittent failures guaranteed.
        options: >-
          --health-cmd "pg_isready -U hooklab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # There is no .env file in CI; pydantic-settings reads these straight from the
      # environment. The key is throwaway, not a secret.
      DATABASE_URL: postgresql+psycopg://hooklab:hooklab@localhost:5432/hooklab
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: throwaway-key-for-ci-only

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Linter
        run: ruff check app/ tests/ scripts/

      - name: Format
        run: ruff format --check app/ tests/ scripts/

      - name: Types
        run: mypy app/ tests/ scripts/

      # The runner's database starts empty. Without this step, any test touching a
      # table fails in CI while passing locally -- the most annoying kind of
      # discrepancy to diagnose.
      - name: Migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest -v
