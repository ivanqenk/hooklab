# Local environment: dependencies only.
# The application itself runs from the host virtualenv so iteration stays fast
# (hot reload without rebuilding an image). The app Dockerfile arrives in the
# deployment phase, which is when it is actually needed.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hooklab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hooklab}
      POSTGRES_DB: ${POSTGRES_DB:-hooklab}
    ports:
      - "5432:5432"
    volumes:
      # NOTE: Postgres 18+ changed the convention. It used to be mounted at
      # /var/lib/postgresql/data; now the mount goes on the PARENT directory and
      # the image places data in a per-major-version subdirectory. Mounting on
      # /data makes the container refuse to start.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Without a healthcheck, `docker compose up` reports ready when the
      # container has started, not when Postgres accepts connections. Those are
      # several seconds apart, and that gap is where first-run failures live.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hooklab}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Named volumes: data survives `docker compose down`.
# To wipe it deliberately: `docker compose down -v`.
volumes:
  postgres-data:
  redis-data:
